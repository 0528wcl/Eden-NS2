name: Build Eden NS2 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eden-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build dependencies
        run: |
          choco install ninja -y --no-progress
          cmake --version
          ninja --version

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure (Release)
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DYUZU_TESTS=OFF `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build Eden
        run: cmake --build build --config Release --parallel 4

      - name: Check executable
        run: |
          if (-not (Test-Path 'build/bin/eden.exe')) {
            throw 'Expected build/bin/eden.exe was not produced.'
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Eden-NS2-Windows-x64-${{ github.sha }}
          path: build/bin/
          if-no-files-found: error
          retention-days: 14
