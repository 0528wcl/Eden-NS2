name: Build Eden NS2 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eden-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply NS2 patch
        run: |
          git apply --check NS2.patch
          if ($LASTEXITCODE -ne 0) { throw 'NS2.patch does not apply cleanly.' }
          git apply NS2.patch
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply NS2.patch.' }
          git status --short

      - name: Set up build dependencies
        run: |
          choco install ninja -y --no-progress
          cmake --version
          ninja --version

      - name: Install Vulkan SDK (glslangValidator)
        uses: humbletim/install-vulkan-sdk@v1.1.1
        with:
          version: latest
          cache: true

      - name: Verify Vulkan shader compiler
        run: |
          $shaderCompiler = Get-Command glslangValidator.exe -ErrorAction SilentlyContinue
          if (-not $shaderCompiler -and $env:VULKAN_SDK) {
            $sdkBin = Join-Path $env:VULKAN_SDK 'Bin'
            if (Test-Path (Join-Path $sdkBin 'glslangValidator.exe')) {
              $sdkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$sdkBin;$env:PATH"
              $shaderCompiler = Get-Command glslangValidator.exe -ErrorAction SilentlyContinue
            }
          }
          if (-not $shaderCompiler) {
            throw 'glslangValidator.exe was not found in PATH or VULKAN_SDK/Bin.'
          }
          & $shaderCompiler.Source --version

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure (Release)
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DYUZU_TESTS=OFF `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build Eden
        run: cmake --build build --config Release --parallel 4

      - name: Check executable
        run: |
          if (-not (Test-Path 'build/bin/eden.exe')) {
            throw 'Expected build/bin/eden.exe was not produced.'
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Eden-NS2-Windows-x64-${{ github.sha }}
          path: build/bin/
          if-no-files-found: error
          retention-days: 14
